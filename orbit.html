<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth Orbit — Real Coordinates</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="universe">
    <div id="stars"></div>

    <div id="solar-system">
        <svg id="orbit-path" aria-hidden="true"></svg>
        <div id="sun"></div>
        <div id="earth-wrap">
            <img src="images/earth.png" alt="Earth" id="earth">
            <div id="moon"></div>
        </div>
    </div>

    <aside id="info-panel" aria-live="polite"></aside>

    <div id="controls">
        <label for="time-speed">Time speed</label>
        <input type="range" id="time-speed" min="1" max="500000" step="1" value="86400">
        <span id="speed-label">1 day/sec</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
